name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Whole runs queue in push order on main, so a newer pending run always replaces an older one,
# and an older commit can never deploy after a newer one. PR runs cancel superseded pushes.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Production only. The `production` environment accepts only main, and it is the only
  # GitHub subject Azure trusts. There are no PR previews, because the SWA token can deploy to production.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Backstop: if main moved while this run was testing, let the newer queued run deploy.
      - id: latest
        name: Skip superseded commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved to $head; skipping the deployment of $GITHUB_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.latest.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - if: steps.latest.outputs.current == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Get deployment token
        if: steps.latest.outputs.current == 'true'
        env:
          SWA_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
          SWA_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          token=$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$SWA_RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "SWA_DEPLOYMENT_TOKEN=$token" >> "$GITHUB_ENV"
      - id: deploy
        if: steps.latest.outputs.current == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
